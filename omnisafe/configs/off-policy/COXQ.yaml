# COX-Q: Constrained Optimistic eXploration Q-learning
# Default hyperparameters match Table D.1 and D.2 (Safe Velocity settings) from the paper.

defaults:
  seed: 0
  env_cfgs:
    # maximum steps per episode; also sets the task's internal step counter
    max_episode_steps: 1000
    # MuJoCo simulation timestep in seconds (re-applied after every reset)
    sim_timestep: 0.002
  # training configurations
  train_cfgs:
    device: cpu
    torch_threads: 16
    vector_env_nums: 1
    parallel: 1
    total_steps: 1000000
    eval_episodes: 1
  algo_cfgs:
    # ── Standard off-policy settings ──────────────────────────────────────────
    steps_per_epoch: 2000
    update_cycle: 1
    update_iters: 1
    size: 1000000
    batch_size: 256
    reward_normalize: False
    cost_normalize: False
    obs_normalize: False
    max_grad_norm: 40
    use_critic_norm: False
    critic_norm_coeff: 0.001
    polyak: 0.005          # τ (soft update coefficient)
    gamma: 0.99
    start_learning_steps: 10240
    policy_delay: 1        # COX-Q updates actor every step (like SAC)
    use_exploration_noise: False
    exploration_noise: 0.1
    # ── SAC temperature ────────────────────────────────────────────────────────
    alpha: 0.2
    auto_alpha: True
    # ── Cost handling ──────────────────────────────────────────────────────────
    use_cost: True
    warmup_epochs: 0       # start Lagrange updates immediately
    episode_len: 1000      # T for converting episode cost → Q-value limit
    # ── TQC quantile critic parameters ────────────────────────────────────────
    num_critics: 5         # N: number of independent critic networks
    num_quantiles: 25      # M: quantile atoms per critic
    truncate_kr: 2         # k_r: reward atoms truncated (top) to reduce overestimation
    truncate_kc: 5         # k_c: cost atoms truncated (bottom) to reduce underestimation
    beta_r: 4.0            # β_r: reward optimism scale for UB
    beta_c: 3.0            # β_c: cost pessimism scale for LB
    alpha_cvar: 13         # α: number of head quantiles for cost CVaR
    # ── COX exploration parameters ─────────────────────────────────────────────
    use_cox: True          # enable COX exploration
    delta_max: 6.0         # δ̄: maximum trust-region size
    delta_lr: 0.0001       # learning rate for adaptive δ update
    adapt_delta: True      # whether to use adaptive δ (Eq. 19)
    # ── ALM (Augmented Lagrangian Method) ─────────────────────────────────────
    alm_coeff: 10.0        # c: convexification coefficient in ALM
  logger_cfgs:
    use_wandb: False
    wandb_project: omnisafe
    use_tensorboard: True
    save_model_freq: 100
    log_dir: "./runs"
    window_lens: 10
  model_cfgs:
    weight_initialization_mode: "kaiming_uniform"
    actor_type: gaussian_sac
    linear_lr_decay: False
    actor:
      hidden_sizes: [256, 256]
      activation: relu
      lr: 0.0003
    critic:
      num_critics: 5
      num_quantiles: 25
      hidden_sizes: [256, 256]
      activation: relu
      lr: 0.0003
  lagrange_cfgs:
    cost_limit: 25.0
    lagrangian_multiplier_init: 1.0
    lambda_lr: 0.0003
    lambda_optimizer: "Adam"

# ── Safe Velocity (Brax-based, episode length 1000) ───────────────────────────
SafetyHopperVelocity-v1:
  algo_cfgs:
    episode_len: 1000
    gamma: 0.99
    truncate_kr: 2
    truncate_kc: 5
    beta_r: 4
    beta_c: 3
    alpha_cvar: 13
  lagrange_cfgs:
    cost_limit: 25.0
    lagrangian_multiplier_init: 1.0
    lambda_lr: 0.0003

