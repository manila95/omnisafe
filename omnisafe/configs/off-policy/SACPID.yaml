defaults:
  # seed for random number generator
  seed: 0
  # environment configurations (passed as kwargs to safety_gymnasium.make)
  env_cfgs:
    # maximum steps per episode; also sets the task's internal step counter
    max_episode_steps: 1000
    # MuJoCo simulation timestep in seconds (re-applied after every reset)
    sim_timestep: 0.002
  # training configurations
  train_cfgs:
    # device to use for training, options: cpu, cuda, cuda:0, cuda:0,1, etc.
    device: cpu
    # number of threads for torch
    torch_threads: 16
    # number of vectorized environments
    vector_env_nums: 1
    # number of parallel agent, similar to a3c
    parallel: 1
    # total number of steps to train
    total_steps: 1000000
    # number of evaluate episodes
    eval_episodes: 0
  # algorithm configurations
  algo_cfgs:
    # number of steps to update the policy
    steps_per_epoch: 2000
    # number of steps per sample
    update_cycle: 1
    # number of iterations to update the policy
    update_iters: 1
    # The size of replay buffer
    size: 1000000
    # The size of batch
    batch_size: 256
    # normalize reward
    reward_normalize: False
    # normalize cost
    cost_normalize: True
    # normalize cost by dividing by cost_limit (stationary, keeps critic and PID on same scale)
    cost_limit_normalize: False
    # evaluate true vs estimated Q-values every N epochs (0 = disabled)
    value_eval_freq: 0
    # Eval episodes for value evaluation
    eval_episodes: 100
    # normalize observation
    obs_normalize: False
    # max gradient norm
    max_grad_norm: 40
    # use critic norm
    use_critic_norm: False
    # critic norm coefficient
    critic_norm_coeff: 0.001
    # The soft update coefficient
    polyak: 0.005
    # The discount factor of GAE
    gamma: 0.99
    # Actor perdorm random action before `start_learning_steps` steps
    start_learning_steps: 10000
    # The delay step of policy update
    policy_delay: 2
    # Whether to use the exploration noise
    use_exploration_noise: False
    # The exploration noise
    exploration_noise: 0.1
    # The policy noise
    policy_noise: 0.2
    # policy_noise_clip
    policy_noise_clip: 0.5
    # The value of alpha
    alpha: 0.2
    # Whether to use auto alpha
    auto_alpha: False
    # use cost
    use_cost: True
    # warm up epoch
    warmup_epochs: 100
    # Recency-biased replay sampling for critics.
    # Time-step indices are weighted by exp(-recency_decay * age), where age=0
    # is the most recent transition.  The two boolean flags control which
    # critics use this weighted batch instead of the standard uniform sample.
    recency_decay: 0.001
    recency_reward_critic: False
    recency_cost_critic: False
    # N-step cost returns (1 = standard 1-step TD, backward-compatible default).
    # When > 1 the cost critic target is computed by summing n real cost steps
    # before bootstrapping, reducing reliance on the critic's own predictions.
    # WARNING: biased under off-policy data — use retrace_lambda instead for the
    # principled version. Kept for ablation comparisons.
    # Note: retrace_lambda takes priority; n_step_cost is used only when retrace_lambda=0.
    n_step_cost: 1
    # Retrace(λ) for the cost critic (Munos et al. 2016).
    # Uses per-step importance sampling ratios to correct for off-policy mismatch
    # between stored (behavior) actions and the current policy.
    # retrace_lambda=0 disables Retrace (default, backward-compatible).
    # retrace_lambda=1 is the standard setting; values in (0,1] are valid.
    retrace_lambda: 0.0
    retrace_n_steps: 5
  # logger configurations
  logger_cfgs:
    # use wandb for logging
    use_wandb: True
    # wandb project name
    wandb_project: omnisafe
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 100
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 10
  # model configurations
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type
    actor_type: gaussian_sac
    # linear learning rate decay
    linear_lr_decay: False
    # Configuration of Actor network
    actor:
      # Size of hidden layers
      hidden_sizes: [256, 256]
      # Activation function
      activation: relu
      # The learning rate of Actor network
      lr: 0.0001
    # Configuration of Critic network
    critic:
      # The number of critic networks
      num_critics: 2
      # Size of hidden layers
      hidden_sizes: [256, 256]
      # Activation function
      activation: relu
      # The learning rate of Critic network
      lr: 0.0003
  # lagrangian configurations
  lagrange_cfgs:
    # The Kp of PID controller
    pid_kp: 0.000001
    # The Ki of PID controller
    pid_ki: 0.0000001
    # The Kd of PID controller
    pid_kd: 0.0000001
    #The delay of PID controller
    pid_d_delay: 10
    # The exponential moving average alpha of the proportional term of the PID controller.
    pid_delta_p_ema_alpha: 0.95
    # The exponential moving average alpha of the derivative term of the PID controller.
    pid_delta_d_ema_alpha: 0.95
    # Whether to normalize the sum of the cost.
    sum_norm: True
    # Whether to normalize the derivate of the cost.
    diff_norm: False
    # Tolerance of constraint violation
    cost_limit: 10.0
    # The max penalty coefficient
    penalty_max: 100.0
    # Initial value of lagrangian multiplier
    lagrangian_multiplier_init: 0.001

SafetyCarCircle1-v0:
  # algorithm configurations
  algo_cfgs:
    # normalize cost
    cost_normalize: False
    # The value of alpha
    alpha: 0.00001
  # model configurations
  model_cfgs:
    # Configuration of Actor network
    actor:
      # The learning rate of Actor network
      lr: 0.000005
    # Configuration of Critic network
    critic:
      # The learning rate of Critic network
      lr: 0.001
  # lagrangian configurations
  lagrange_cfgs:
    # The Kp of PID controller
    pid_kp: 0.0000005
    # The Ki of PID controller
    pid_ki: 0.00000001
    # The Kd of PID controller
    pid_kd: 0.00000001

