defaults:
  # seed for random number generator
  seed: 0
  # training configurations
  train_cfgs:
    # device to use for training, options: cpu, cuda, cuda:0, cuda:0,1, etc.
    device: cuda:1
    # number of threads for torch
    torch_threads: 16
    # number of vectorized environments
    vector_env_nums: 10
    # number of parallel agent, similar to a3c
    parallel: 1
    # total number of steps to train
    total_steps: 10000000
  # algorithm configurations
  algo_cfgs:
    # number of steps to update the policy
    steps_per_epoch: 20000
    # number of iterations to update the policy
    update_iters: 10
    # batch size for each iteration
    batch_size: 128
    # target kl divergence
    target_kl: 0.01
    # entropy coefficient
    entropy_coef: 0.0
    # normalize reward
    reward_normalize: True
    # normalize cost
    cost_normalize: True
    # normalize observation
    obs_normalize: True
    # early stop when kl divergence is bigger than target kl
    kl_early_stop: False
    # use max gradient norm
    use_max_grad_norm: True
    # max gradient norm
    max_grad_norm: 40.0
    # use critic norm
    use_critic_norm: True
    # critic norm coefficient
    critic_norm_coef: 0.001
    # reward discount factor
    gamma: 0.99
    # cost discount factor
    cost_gamma: 0.99
    # lambda for gae
    lam: 0.95
    # lambda for cost gae
    lam_c: 0.95
    # advantage estimation method, options: gae, retrace
    # MICE\'s intrinsic-cost advantage is only implemented for gae; see
    # mice_buffer._calculate_balancing_intrinsic_adv_and_value_targets.
    adv_estimation_method: gae
    # standardize reward advantage
    standardized_rew_adv: True
    # standardize cost advantage
    standardized_cost_adv: True
    # penalty coefficient
    penalty_coef: 0.0
    # use cost
    use_cost: True
    # Damping value for conjugate gradient
    cg_damping: 0.1
    # Number of conjugate gradient iterations
    cg_iters: 15
    # Subsampled observation
    fvp_obs: None
    # Tolerance of constraint violation
    cost_limit: 10
    eval_critic: True
    # Cadence. early_eval_freq applies below early_eval_epochs, value_eval_freq at or above it;
    # the run's first evaluation is always epoch 1 (at epoch 0 the rollout comes from the
    # freshly initialised policy and critics, so there is no trained update to look at).
    early_eval_freq: 5
    early_eval_epochs: 50
    value_eval_freq: 50
    # --- s0 study: fixed layouts, re-rolled to get a real MC estimate ----------------------
    # Probe layouts are env reset seeds, held constant for the whole run so every eval epoch
    # re-probes the same states.
    mc_value_study_probes: 17
    mc_value_study_repeats: 10
    mc_value_study_seed_offset: 100000
    # Probe rollouts run concurrently (subprocess-parallel vectorized env). Each probe still
    # gets its own independent reset(seed=X); this only parallelizes across probes.
    mc_value_study_vector_envs: 5
    # --- intermediate-state study: states the policy actually visits mid-episode -----------
    # Captured by simulator snapshot/restore, since reset(seed=X) cannot reach them. Note this
    # env is built with num_envs = intermediate_state_study_probes, so its wall-clock is set by
    # positions x repeats and is independent of the probe count.
    intermediate_state_study_positions: [100, 300, 500, 700, 900]
    intermediate_state_study_probes: 17
    intermediate_state_study_repeats: 10
    # --- rollout horizon -------------------------------------------------------------------
    # Truncate a probe rollout once the discounted tail falls below this fraction. At gamma=0.99,
    # 0.01 stops at step 459 of 1000 -- 2.18x fewer simulated steps.
    mc_eval_bootstrap_threshold: 0.01
    # What to do with that truncated tail. Required when the threshold is non-null; null makes a
    # non-null threshold raise rather than silently biasing every value.
    #   'drop'      -- stop accumulating. The value is the exact truncated discounted sum, low by
    #                  at most the threshold of its own scale, one-sided and analytically known.
    #                  Stays simulation-only, so a cost value is still non-negative and the
    #                  critic never enters the "ground truth" it is being measured against.
    #   'bootstrap' -- estimate the tail with the critic's own value there. Unbiased in
    #                  principle, circular in practice.
    mc_eval_tail: drop
    # The sub-sampling rate of the observation
    fvp_sample_freq: 1
    # buf_size
    buf_maxlen: 100
    # intrinsic factor
    intrinsic_factor: 5.0
    # k in knn
    k_knn: 10
    # if test the cost estimate error
  # logger configurations
  logger_cfgs:
    # use wandb for logging
    use_wandb: False
    # wandb project name
    wandb_project: omnisafe
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 100
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 100
  # model configurations
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type, options: gaussian, gaussian_learning
    actor_type: gaussian_learning
    # linear learning rate decay
    linear_lr_decay: True
    # exploration noise anneal
    exploration_noise_anneal: False
    # std upper bound, and lower bound
    std_range: [0.5, 0.1]
    # embedding dimension
    emb_dim: 8
    # actor network configurations
    actor:
      # hidden layer sizes
      hidden_sizes: [64, 64]
      # activation function
      activation: tanh
      # out_activation: tanh
      # learning rate
      lr: ~
    critic:
      # hidden layer sizes
      hidden_sizes: [256, 256]
      # activation function
      activation: tanh
      # learning rate
      lr: 0.001

SafeMetaDrive:
  # training configurations
  train_cfgs:
    # total number of steps to train
    total_steps: 500000
  # logger configurations
  logger_cfgs:
    # save model frequency
    save_model_freq: 15
  # algorithm configurations
  algo_cfgs:
    # batch size for each iteration
    batch_size: 512
    # number of steps to update the policy
    steps_per_epoch: 3000
    # number of iterations to update the policy
    update_iters: 10
    # normalize reward
    reward_normalize: False
    # normalize cost
    cost_normalize: True
    # normalize observation
    obs_normalize: False
    # max gradient norm
    max_grad_norm: 20.0
    cost_limit: 1
  # model configurations
  model_cfgs:
    # actor network configurations
    actor:
      # size of hidden layers
      hidden_sizes: [256, 256]
      # learning rate
      lr: 0.00005
    # critic network configurations
    critic:
      # size of hidden layers
      hidden_sizes: [256, 256]
      # learning rate
      lr: 0.00005
  # environment specific configurations
  env_cfgs:
  # safe meta drive configurations. More details refer to https://github.com/decisionforce/EGPO
    meta_drive_config:
      # max iterations of interactions
      horizon: 1500
      # whether to use random traffic
      random_traffic: False
      # the penalty when crash into other vehicles
      crash_vehicle_penalty: 1.
      # the penalty when crash into other objects
      crash_object_penalty: 0.5
      # the penalty when out of road
      out_of_road_penalty: 1.
